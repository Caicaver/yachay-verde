<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yachay Verde — Identificador de Plantas Medicinales</title>
<style>
  body { font-family: Arial, sans-serif; max-width: 480px; margin: auto; padding: 16px; text-align: center; }
  h1 { color: #2e7d32; font-size: 1.4em; }
  #imagen-preview { max-width: 100%; border-radius: 8px; margin: 12px 0; display:none; }
  button, input[type="file"] { padding: 10px 16px; margin: 6px; border-radius: 8px; border: none; background:#2e7d32; color:white; font-size:1em; }
  #resultado { margin-top: 16px; padding: 12px; border-radius: 8px; background:#f1f8e9; }
  #ficha { margin-top: 12px; padding: 14px; border-radius: 8px; background:#fff3e0; text-align:left; display:none; }
  #advertencia { font-size:0.85em; color:#b71c1c; margin-top:10px; }
  #reintento { color:#e65100; font-weight:bold; display:none; }
</style>
</head>
<body>

<h1>🌿 Yachay Verde</h1>
<p>Toma o sube una foto de la planta para identificarla</p>

<input type="file" accept="image/*" capture="environment" id="input-foto">
<img id="imagen-preview">
<div id="resultado">Esperando una foto...</div>
<div id="reintento">⚠️ No estamos seguros. Intenta con una foto con más luz natural y fondo liso.</div>
<div id="ficha"></div>
<p id="advertencia">Esta aplicación orienta, pero no reemplaza la consulta con un profesional de salud.</p>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8.3/dist/teachablemachine-image.min.js"></script>
<script>
const URL_MODELO = "./model/";
let model;
const UMBRAL_CONFIANZA = 0.70;

const fichas = {
  "Hercampuri": {
    quechua: "Por confirmar",
    uso: "Hepático y digestivo; también usado como antidiabético y diurético.",
    parte: "Hojas.",
    dosis: "Infusión, 10-15 g por litro de agua hirviendo.",
    contraindicacion: "No recomendado en gestantes ni personas muy delgadas."
  },
  "Muña": {
    quechua: "Muña",
    uso: "Digestivo: alivia cólicos, gases e indigestión.",
    parte: "Hojas y tallos.",
    dosis: "Infusión o decocción, 2 veces al día.",
    contraindicacion: "Evitar dosis altas prolongadas por riesgo de toxicidad hepática y pulmonar."
  },
  "Tara": {
    quechua: "Por confirmar",
    uso: "Antiinflamatorio de garganta y protector gástrico/hepático.",
    parte: "Vainas y hojas.",
    dosis: "Gárgaras de infusión de vainas para amigdalitis; infusión de hojas para estomatitis.",
    contraindicacion: "No reportada en las fuentes revisadas; usar con moderación."
  },
  "Valeriana": {
    quechua: "Por confirmar",
    uso: "Sedante y ansiolítico, ayuda con el insomnio.",
    parte: "Raíz.",
    dosis: "10 g de raíz seca por litro de agua, cocción 5 min, 1 taza antes de dormir.",
    contraindicacion: "Evitar combinar con sedantes o alcohol sin supervisión médica."
  }
};

async function cargarModelo() {
  const modelURL = URL_MODELO + "model.json";
  const metadataURL = URL_MODELO + "metadata.json";
  model = await tmImage.load(modelURL, metadataURL);
  document.getElementById("resultado").innerText = "Modelo listo. Sube una foto.";
}

async function predecir(imagenElemento) {
  const prediccion = await model.predict(imagenElemento);
  prediccion.sort((a, b) => b.probability - a.probability);
  const mejor = prediccion[0];

  const reintentoDiv = document.getElementById("reintento");
  const fichaDiv = document.getElementById("ficha");
  const resultadoDiv = document.getElementById("resultado");

  if (mejor.probability < UMBRAL_CONFIANZA) {
    resultadoDiv.innerText = "";
    reintentoDiv.style.display = "block";
    fichaDiv.style.display = "none";
    return;
  }

  reintentoDiv.style.display = "none";
  resultadoDiv.innerText = `Especie identificada: ${mejor.className} (${(mejor.probability*100).toFixed(1)}% de confianza)`;

  const info = fichas[mejor.className];
  if (info) {
    fichaDiv.style.display = "block";
    fichaDiv.innerHTML = `
      <strong>Nombre en quechua:</strong> ${info.quechua}<br>
      <strong>Uso tradicional:</strong> ${info.uso}<br>
      <strong>Parte empleada:</strong> ${info.parte}<br>
      <strong>Dosis referencial:</strong> ${info.dosis}<br>
      <strong>Contraindicaciones:</strong> ${info.contraindicacion}
    `;
  } else {
    fichaDiv.style.display = "none";
    console.warn("No se encontró ficha para la clase:", mejor.className);
  }
}

document.getElementById("input-foto").addEventListener("change", function(e) {
  const archivo = e.target.files[0];
  if (!archivo) return;
  const img = document.getElementById("imagen-preview");
  img.src = URL.createObjectURL(archivo);
  img.style.display = "block";
  img.onload = () => predecir(img);
});

cargarModelo();
</script>
</body>
</html>
